name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix dashboard ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build plugin bundle
        run: npm run build:plugin

      - name: Check committed plugin bundle is up to date
        run: |
          if [ -n "$(git status --porcelain -- pr-map-plugin)" ]; then
            git status --porcelain -- pr-map-plugin
            git --no-pager diff -- pr-map-plugin | head -100
            echo "Committed pr-map-plugin bundle is out of date. Run npm run build:plugin and commit the result."
            exit 1
          fi
